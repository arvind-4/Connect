<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
          content="{% block meta_description %}Default description of your site{% endblock meta_description %}" />
    <meta name="keywords"
          content="{% block meta_keywords %}django, web app, backend{% endblock meta_keywords %}" />
    <meta name="author" content="Connect" />
    {% include "_css.html" %}
    {% include "_js.html" %}
    {% block head %}
    {% endblock head %}
    <title>
      {% block title %}
      {% endblock title %}
    </title>
  </head>
  <body>
    {% block content %}
    {% endblock content %}
  </body>
</html>
